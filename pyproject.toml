[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intel-platform"
version = "1.0.0"
description = "Production-grade multi-agent financial intelligence and reporting platform"
readme = "00_overview_and_architecture.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis[hiredis]>=5.0.4",
    "langgraph>=0.0.60",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "yfinance>=0.2.40",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "locust>=2.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
