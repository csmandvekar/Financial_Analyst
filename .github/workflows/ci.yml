name: CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financial_user
          POSTGRES_PASSWORD: financial_pass
          POSTGRES_DB: financial_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .

      - name: Type Check (Mypy)
        run: |
          mypy packages/ apps/ --ignore-missing-imports

      - name: Run Full Test Suite with Coverage (Unit + Contract + Integration + Chaos)
        env:
          DATABASE_URL: postgresql+asyncpg://financial_user:financial_pass@localhost:5432/financial_intelligence
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest -v --cov=packages --cov=apps --cov-fail-under=80

      - name: Verify Docker Compose Config
        run: |
          docker compose -f docker/docker-compose.yml config
